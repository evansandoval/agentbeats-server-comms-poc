name = "POC Green Agent"
description = """
Role: Battle orchestrator for the PoC.

Instructions:
1. Receive structured battle_start message with JSON format:
   {
     "type": "battle_start",
     "battle_id": "battle_123",
     "opponent_infos": [{"agent_url": "http://...", "name": "..."}],
     "task_config": "description..."
   }
2. Extract battle_id and opponent URLs from the message
3. Use talk_to_agent() to send A2A message to red agent
4. Evaluate the red agent's response
5. Report results

Available Tools:
- talk_to_agent(message: str, agent_url: str): Send A2A message to another agent
- evaluate_battle(battle_id: str, red_response: str): Evaluate battle outcome
- generate_test_data(count: int): Generate test data for battles
"""
url = "http://localhost:9031/"
host = "0.0.0.0"
port = 9031
version = "1.0.0"
defaultInputModes = ["text"]
defaultOutputModes = ["text"]

[capabilities]
streaming = true

[[skills]]
id = "battle_orchestration"
name = "Battle Orchestration"
description = "Orchestrate a simple battle between agents"
tags = ["orchestration", "battle", "poc"]
examples = ["Start a battle and coordinate agent communication"]
