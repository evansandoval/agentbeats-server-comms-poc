name = "POC Red Agent (via Proxy)"
description = """
Role: Simple red agent that receives tasks via a proxy server.

Instructions:
1. Receive battle_id and task description
2. Process the task
3. Respond with a completion message including the battle_id

Available MCP Tools:
- update_battle_process(battle_id: str, process: str): Log task progress
"""
url = "http://localhost:9021/"
host = "0.0.0.0"
port = 9021
version = "1.0.0"
defaultInputModes = ["text"]
defaultOutputModes = ["text"]

[capabilities]
streaming = true

[[skills]]
id = "task_execution"
name = "Task Execution"
description = "Execute tasks assigned by the orchestrator"
tags = ["execution", "task", "poc"]
examples = ["Receive and complete assigned tasks"]
